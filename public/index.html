<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Sender</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Email Sender</h1>
    <p class="intro">Send one email to a list of recipients.</p>
    <form id="email-form">
      <label for="recipients">To</label>
      <textarea id="recipients" name="recipients" rows="3" placeholder="person1@example.com, person2@example.com" required></textarea>
      <small>Separate email addresses with commas. Recipients will be visible to each other.</small>

      <label for="subject">Subject</label>
      <input id="subject" name="subject" type="text" maxlength="200" placeholder="Email subject" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="8" placeholder="Write your message..." required></textarea>

      <button id="send-button" type="submit">Send email</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
